name: Tests and toolkit release gate
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run dependency-free smoke check
        run: python scripts/smoke_test.py
      - name: Run standard-library unit tests
        run: python -m unittest discover -s tests -v
  parsing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install optional parser dependencies
        run: python -m pip install -r requirements-parsing.txt
      - name: Run parser and regression tests without model weights
        run: python -m unittest discover -s tests -v
      - name: Verify reviewed pilot source and preserved execution evidence
        run: python scripts/verify_pilot_release.py
  wheel:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build the wheel, install it outside the checkout and exercise the installed CLI/API
        run: python scripts/verify_wheel_install.py
